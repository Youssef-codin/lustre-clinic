<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Lustre Clinic — app icon (C, stencil, inverted)</title>
  <!-- For light surfaces, print, and anywhere the ink tile would read as a black block.
       Not the default. -->
  <defs>
    <linearGradient id="inkFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="25%" stop-color="#5A544C"/>
      <stop offset="100%" stop-color="#14110F"/>
    </linearGradient>
    <mask id="stencilC2" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="118">
      <circle cx="50" cy="59" r="50" fill="#fff"/>
      <ellipse cx="50" cy="59" rx="41" ry="28" fill="#000"/>
      <polygon points="50,59 130,20 130,98" fill="#000"/>
      <rect x="45" y="2" width="10" height="32" fill="#000" transform="rotate(-52 50 59)"/>
      <rect x="45" y="2" width="10" height="32" fill="#000" transform="rotate(-128 50 59)"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="112" fill="#F2EDE6"/>
  <g transform="translate(106,79) scale(3)">
    <rect x="0" y="9" width="100" height="100" fill="url(#inkFill)" mask="url(#stencilC2)"/>
  </g>
</svg>
