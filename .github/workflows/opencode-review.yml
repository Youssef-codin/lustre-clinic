name: opencode review

# Automatic PR review. `opencode github run` only supports comment events,
# so this runs the CLI directly and posts the result with `gh`.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install opencode
        env:
          # Pinned deliberately: this job holds OPENCODE_API_KEY. Bump manually.
          VERSION: 1.18.11
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Review
        shell: bash
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          opencode run --model opencode/big-pickle "$(cat <<'EOF'
          Review this pull request. Get the diff with:
            git diff $BASE_SHA...$HEAD_SHA

          Project rules live in CLAUDE.MD and docs/SPEC.MD — read them first
          and treat them as authoritative. Pay particular attention to:
            - money handled as integer piastres (no floats/decimals)
            - timestamps as timestamptz, IDs as UUIDv7
            - thin routers: no logic or DB access in a router
            - no module importing another module's router
            - no hand-written request/response types
            - no patient data in logs (pino or Discord alerts)
            - client localizes from ERROR_CODE, not message text
            - no `any` unless strictly necessary

          Report only concrete defects: correctness bugs, security issues,
          data-loss risks, and violations of the rules above. Cite file:line
          for each. Do not restate what the diff does and do not suggest
          stylistic rewrites — biome owns formatting. If the change is clean,
          reply with exactly: LGTM

          Output the review as markdown, with no preamble, wrapped in
          sentinels on their own lines:

          <<<REVIEW>>>
          ...your review here...
          <<<END>>>
          EOF
          )" >raw.txt 2>run.log || { echo "opencode failed:"; cat run.log; exit 1; }

          # opencode prints its tool-call transcript to stdout too, so keep
          # only what is between the sentinels and strip ANSI escapes.
          sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' raw.txt \
            | awk '/^<<<REVIEW>>>/{f=1;next} /^<<<END>>>/{f=0} f' \
            > review.md
          cat review.md

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s review.md ]; then
            echo "reviewer produced no sentinel-delimited output — review did not happen"
            exit 1
          fi
          if [ "$(tr -d '[:space:]' < review.md)" = "LGTM" ]; then
            echo "clean review, nothing to post"
            exit 0
          fi
          {
            echo "## 🔍 opencode review"
            echo
            cat review.md
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
