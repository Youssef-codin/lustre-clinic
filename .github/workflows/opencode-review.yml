name: opencode review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: anomalyco/opencode/github@v1.18.11
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          use_github_token: true
          model: opencode/big-pickle
          share: false
          prompt: |
            Review the changes in this pull request against the base branch.

            Project rules live in CLAUDE.MD and docs/SPEC.MD — read them first
            and treat them as authoritative. Pay particular attention to:
              - money handled as integer piastres (no floats/decimals)
              - timestamps as timestamptz, IDs as UUIDv7
              - thin routers: no logic or DB access in a router
              - no module importing another module's router
              - no hand-written request/response types
              - no patient data in logs (pino or Discord alerts)
              - client localizes from ERROR_CODE, not message text
              - no `any` unless strictly necessary

            Report only concrete defects: correctness bugs, security issues,
            data-loss risks, and violations of the rules above. Cite
            file:line for each. Do not restate what the diff does, do not
            suggest stylistic rewrites (biome owns formatting), and say
            nothing if the change is clean.

            Post your findings as a single PR comment.
